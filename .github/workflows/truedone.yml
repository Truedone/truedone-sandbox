# The sandbox's own test job. The truedone step comes after the setup and before the tests, as the action's README says.
name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --prefix vitest
      - run: python -m pip install pytest==9.0.3
      # The action from Truedone/truedone's main branch, so each sandbox pull request runs the action as it is on main
      # now, and the post-merge gate tests a newly merged action. The sandbox is a test bed; production users pin a tag.
      - uses: Truedone/truedone/packages/action@e6fbedfebe5a7392f4011977d3bcc52ed5a84529
      - run: npm test --prefix node-test
      - run: npm test --prefix vitest
      - run: python -m pytest
        working-directory: python
