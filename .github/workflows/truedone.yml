# The sandbox's own test job. The truedone step comes after the setup and before the tests, as the action's README says.
name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --prefix vitest
      - run: python -m pip install pytest==9.0.3
      # PLACEHOLDER until OPS-07 publishes the action: the sha and the tag become the published release's.
      # The action from the main repository, pinned to a commit on its main, until Truedone/truedone-action carries v0.1.0 (REL-P6);
      # the smoke (tools/smoke-action.mjs) re-pins this line in the branch it seeds.
      - uses: Truedone/truedone/packages/action@b3a2d7081d69e8de822c5847fe0ce523c593aabc
      - run: npm test --prefix node-test
      - run: npm test --prefix vitest
      - run: python -m pytest
        working-directory: python
